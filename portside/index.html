<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Portside — Container Shipping Platform</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230676b4'/><text x='16' y='23' font-size='19' font-family='system-ui' font-weight='700' fill='white' text-anchor='middle'>B</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- Lato is Portside's UI font; their own stylesheet loads it from fonts.gstatic.com -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,400&display=swap" />

<!-- Portside's OWN stylesheets, exactly as /embedded loads them. These bring the real
     Semantic UI component system (6,054 .ui.* rules) and their 355 design tokens. -->
<link rel="stylesheet" href="./vendor/ui/vendor.css" />
<link rel="stylesheet" href="./vendor/ui/main.css" />
<!-- our application layer: chrome, layout utilities and the few custom widgets -->
<link rel="stylesheet" href="./app.css" />
</head>
<body>
  <div id="app" class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="app-content" id="view"></main>
    </div>
  </div>

  <div class="palette-backdrop" id="palette-backdrop" hidden>
    <div class="palette" role="dialog" aria-label="Global search">
      <input id="palette-input" class="palette-input" placeholder="Search shipments, containers, bookings, B/L…  (↑↓ to move, ⏎ to open, esc to close)" autocomplete="off" />
      <div class="palette-results" id="palette-results"></div>
    </div>
  </div>

  <div class="toasts" id="toasts"></div>
  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="drawer" hidden></aside>

  <script type="module" src="./js/app.js"></script>
  <noscript>This replica needs JavaScript.</noscript>
  <!--
    Safety net: if this page is opened as file:///, browsers block ES modules (CORS),
    so nothing boots. Detect that and point at the single-file build / the served URL.
    In the bundled portside.html the app boots immediately and this never appears.
  -->
  <script>
    setTimeout(function () {
      var sb = document.getElementById('sidebar');
      if (sb && sb.childElementCount > 0) return;               // booted fine
      if (location.protocol !== 'file:') return;
      var box = document.createElement('div');
      box.style.cssText = 'position:fixed;inset:0;display:grid;place-items:center;background:#f2f4f6;padding:24px;z-index:999';
      box.innerHTML =
        '<div style="max-width:620px;background:#fff;border:1px solid #e6e9ec;border-radius:10px;padding:26px;font:14px/1.5 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;color:#1b1c1d">' +
          '<h2 style="margin:0 0 8px;font-size:18px">Open this over HTTP, not file://</h2>' +
          '<p style="margin:0 0 12px;color:#4a4f55">Browsers block ES modules on <code>file://</code> URLs (CORS), ' +
          'so the app never starts. Either double-click <b>portside.html</b> (single file, no server), or serve the folder:</p>' +
          '<pre style="margin:0 0 12px;background:#f9fafb;border:1px solid #e6e9ec;border-radius:6px;padding:10px;overflow:auto">' +
          'cd ' + location.pathname.replace(/\/index\.html$/, '') + '\npython3 -m http.server 8099 --bind 127.0.0.1\n# then open http://127.0.0.1:8099</pre>' +
          '<p style="margin:0;color:#4a4f55">A server is already running at ' +
          '<a href="http://127.0.0.1:8099">http://127.0.0.1:8099</a> if you started one earlier.</p>' +
        '</div>';
      document.body.appendChild(box);
    }, 900);
  </script>
</body>
</html>
